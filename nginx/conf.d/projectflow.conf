upstream api_gateway {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name projectflow.local;

    # Health check del propio nginx
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # Todo el tráfico va al API Gateway
    location / {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Bloquear acceso directo a servicios internos
    location ~ ^/(auth-service|user-service|project-service|graphql-api) {
        return 403 '{"error":"Direct access not allowed"}';
        add_header Content-Type application/json;
    }
}
