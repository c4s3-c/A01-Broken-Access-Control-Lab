SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Regla: Detectar header injection desde el exterior
SecRule REQUEST_HEADERS_NAMES "^x-user-" \
    "id:1001,phase:1,deny,status:403,\
     msg:'Possible header injection attempt',\
     logdata:'%{MATCHED_VAR}'"

# Regla: Detectar GraphQL introspection
SecRule REQUEST_BODY "__schema" \
    "id:1002,phase:2,deny,status:403,\
     msg:'GraphQL introspection detected'"

# Regla: Detectar posibles race conditions (muchas requests rápidas)
SecAction "id:1004,phase:1,initcol:IP=%{REMOTE_ADDR},\
    setvar:IP.REQUEST_COUNT=+1,\
    expirevar:IP.REQUEST_COUNT=10"

SecRule IP:REQUEST_COUNT "@gt 50" \
    "id:1003,phase:1,deny,status:429,\
     msg:'Possible race condition attack'"
